name: Validate
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has_images: ${{ steps.matrix.outputs.has_images }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-ci.txt
      - run: python scripts/library.py check
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q scripts tests
      - name: Shell syntax
        run: find scripts images tests -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
      - id: matrix
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            matrix=$(python scripts/library.py affected --base "$BASE_SHA")
          else
            matrix=$(python scripts/library.py affected --all)
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "has_images=$(python -c 'import json,sys; print(str(bool(json.loads(sys.argv[1])["line"])).lower())' "$matrix")" >> "$GITHUB_OUTPUT"
  images:
    needs: metadata
    if: needs.metadata.outputs.has_images == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.metadata.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: /tmp/image-library-build-cache
          key: buildx-${{ runner.os }}-${{ matrix.line }}-${{ github.sha }}
          restore-keys: |
            buildx-${{ runner.os }}-${{ matrix.line }}-
      - name: Build and exercise the documented recipe
        env:
          LIBRARY_CACHE_DIR: /tmp/image-library-build-cache
          LINE: ${{ matrix.line }}
          SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p out
          python scripts/build.py "$LINE" image-library-check:dev --source "$SOURCE" --cache "${LINE//\//-}" --inventory out/dev.json
          if [[ "$LINE" == php-dev/* ]]; then
            python scripts/build.py "php-browser/${LINE#*/}" image-library-check:browser --parent image-library-check:dev --source "$SOURCE" --inventory out/browser.json
          fi
          docker image inspect image-library-check:dev --format '{{.Size}}' >out/image-size-bytes.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: inventory-${{ strategy.job-index }}
          path: out/
          if-no-files-found: ignore
  checks:
    if: always()
    needs: [metadata, images]
    runs-on: ubuntu-24.04
    steps:
      - env:
          METADATA: ${{ needs.metadata.result }}
          IMAGES: ${{ needs.images.result }}
        run: |
          test "$METADATA" = success
          [[ "$IMAGES" == success || "$IMAGES" == skipped ]]
