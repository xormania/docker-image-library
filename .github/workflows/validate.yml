name: Validate
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has_images: ${{ steps.matrix.outputs.has_images }}
      resources: ${{ steps.resources.outputs.resources }}
      environments: ${{ steps.resources.outputs.environments }}
      has_resources: ${{ steps.resources.outputs.has_resources }}
      has_environments: ${{ steps.resources.outputs.has_environments }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install -r requirements-ci.txt
      - run: python scripts/library.py check
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q scripts tests
      - name: Shell syntax
        run: find scripts images tests examples -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
      - id: matrix
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            matrix=$(python scripts/library.py affected --base "$BASE_SHA")
          else
            matrix=$(python scripts/library.py affected --all)
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "has_images=$(python -c 'import json,sys; print(str(bool(json.loads(sys.argv[1])["line"])).lower())' "$matrix")" >> "$GITHUB_OUTPUT"
      - id: resources
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PYTHONPATH: scripts
        run: |
          if [ -n "$BASE_SHA" ]; then
            matrix=$(python -m xorder.verify matrix --base "$BASE_SHA")
          else
            matrix=$(python -m xorder.verify matrix --all)
          fi
          python -c 'import json,sys; m=json.loads(sys.argv[1]); print("resources="+json.dumps({"resource":m["resource"]})); print("environments="+json.dumps({"resource":m["environment"]})); print("has_resources="+str(bool(m["resource"])).lower()); print("has_environments="+str(bool(m["environment"])).lower())' "$matrix" >> "$GITHUB_OUTPUT"
  resources:
    needs: metadata
    if: needs.metadata.outputs.has_resources == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.metadata.outputs.resources) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: scripts
      RESOURCE: ${{ matrix.resource }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python -m pip install -r requirements-ci.txt
      - name: Exercise downloaded or packaged resource bytes
        run: python -m xorder.verify verify "$RESOURCE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: resource-check-${{ strategy.job-index }}
          path: out/resources/
          if-no-files-found: ignore
  environments:
    needs: metadata
    if: needs.metadata.outputs.has_environments == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.metadata.outputs.environments) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONPATH: scripts
      RESOURCE: ${{ matrix.resource }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python -m pip install -r requirements-ci.txt
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            extra-substituters = https://devenv.cachix.org
            extra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw=
      - name: Install pinned devenv
        run: nix profile install 'github:cachix/devenv/b904dcb51fe48c30db250038241507f60752f222#devenv'
      - name: Exercise the packaged native environment
        run: python -m xorder.verify verify "$RESOURCE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: environment-check-${{ strategy.job-index }}
          path: out/resources/
          if-no-files-found: ignore
  images:
    needs: metadata
    if: needs.metadata.outputs.has_images == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.metadata.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enable local PHP parents and cache export
        if: startsWith(matrix.line, 'php-')
        uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5
        with:
          daemon-config: '{"features":{"containerd-snapshotter":true}}'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: ${{ startsWith(matrix.line, 'php-') && 'docker' || 'docker-container' }}
      - id: cache-key
        env:
          LINE: ${{ matrix.line }}
        run: echo "key=$(python scripts/library.py cache-key "$LINE")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/image-library-build-cache
          key: buildx-v2-${{ runner.os }}-${{ matrix.line }}-${{ steps.cache-key.outputs.key }}
          restore-keys: |
            buildx-v2-${{ runner.os }}-${{ matrix.line }}-
      - name: Build and exercise the documented recipe
        env:
          LIBRARY_CACHE_DIR: /tmp/image-library-build-cache
          LINE: ${{ matrix.line }}
          SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p out
          python scripts/build.py "$LINE" image-library-check:dev --source "$SOURCE" --cache "${LINE//\//-}" --inventory out/dev.json --cache-probe --children
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: inventory-${{ strategy.job-index }}
          path: out/
          if-no-files-found: ignore
  checks:
    if: always()
    needs: [metadata, images, resources, environments]
    runs-on: ubuntu-24.04
    steps:
      - env:
          METADATA: ${{ needs.metadata.result }}
          IMAGES: ${{ needs.images.result }}
          RESOURCES: ${{ needs.resources.result }}
          ENVIRONMENTS: ${{ needs.environments.result }}
        run: |
          test "$METADATA" = success
          [[ "$IMAGES" == success || "$IMAGES" == skipped ]]
          [[ "$RESOURCES" == success || "$RESOURCES" == skipped ]]
          [[ "$ENVIRONMENTS" == success || "$ENVIRONMENTS" == skipped ]]
